# Docker Engine 25.0+ raised its minimum supported API version past what Testcontainers 1.x's
# bundled docker-java auto-negotiates by default against very new daemons (it falls back to a
# hardcoded old version - 1.32 - and the daemon rejects it: "client version 1.32 is too old.
# Minimum supported API version is 1.40"). Pinning an explicit, modern version here skips that
# broken auto-negotiation. Test-scope only - never packaged into the runtime jar.
# https://github.com/testcontainers/testcontainers-java/issues/11210
api.version=1.44
